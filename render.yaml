# Render Blueprint: creates the PostgreSQL database and the backend together.
# The frontend is on Netlify (see netlify.toml).
databases:
  - name: traceintel-db
    databaseName: traceintel
    user: traceintel
    plan: free

services:
  - type: web
    name: traceintel-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: traceintel-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: traceintel-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: traceintel-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: traceintel-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: traceintel-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      # Your Netlify address, for example https://traceintel.netlify.app. Render asks for it on the first deploy.
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
